<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../headers/headerRH.php">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <title>Buzon de Quejas</title>
</head>
<body>
    <header class="header">
        <h1>Buzón de Quejas</h1>
    </header>
    <main class="main">
        <div class="formulario">
            <form name="frm" id="frm" method="POST" action="../../controlador/buzon/crearQueja.php">
                <!-- Opción para queja anónima -->
                <div class="form-check mb-3">
                    <input name="complaintType" id="qa" class="form-check-input" type="checkbox">
                    <label for="qa" class="form-check-label">Queja Anónima</label>
                </div>
                
                <!-- Información Personal -->
                <div class="mb-3" id="infoPersonal">
                    <label for="nombre" class="form-label">Nombre completo:</label>
                    <input type="text" name="nombre" id="nombre" class="form-control">
                    <p class="alert alert-danger" id="nom" style="display: none;">Ingresa un nombre válido!!!</p>

                    <label for="telefono" class="form-label">Teléfono:</label>
                    <input type="text" name="telefono" id="telefono" class="form-control">
                    <p class="alert alert-danger" id="tel" style="display: none;">Ingresa un teléfono con solo 10 dígitos</p>
                </div>

                <!-- Domicilio -->
                <div class="mb-3">
                    <label for="domicilio" class="form-label">Domicilio:</label>
                    <input type="text" name="domicilio" id="domicilio" class="form-control">
                </div>

                <!-- Motivo -->
                <div class="mb-3">
                    <label for="motivo" class="form-label">Motivo:</label>
                    <input type="text" name="motivo" id="motivo" class="form-control">
                </div>

                <!-- Hechos -->
                <div class="mb-3">
                    <label for="hechos" class="form-label">Hechos:</label>
                    <input type="text" name="hechos" id="hechos" class="form-control">
                </div>

                <!-- Tiene pruebas -->
                <div class="form-check mb-3">
                    <input name="hasProof" id="hasProof" class="form-check-input" type="checkbox">
                    <label for="hasProof" class="form-check-label">¿Tiene pruebas?</label>
                </div>

                <!-- Especificación de pruebas -->
                <div class="mb-3" id="espeSection" style="display: none;">
                    <label for="espe" class="form-label">Ingrese el tipo de prueba que tiene:</label>
                    <input type="text" name="espe" id="espe" class="form-control">
                </div>

                <!-- Botón de Enviar -->
                <div>
                    <input type="submit" value="Enviar Datos" class="form_btn">
                    <p class="alert alert-success" id="successMsg" style="display: none;">¡Queja enviada correctamente!</p>
                    <p class="alert alert-danger" id="errorMsg" style="display: none;">Hubo un error al enviar la queja.</p>
                </div>
            </form>  
        </div>
    </main> 
</body>
<script src="../../controlador/buzon/validaciones.js"></script>
</html>
