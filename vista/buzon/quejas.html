<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/stylebquejas.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <title>Buzón de Quejas</title>

</head>
<body>
    <header class="header">
        <img src="../img/logo.webp" alt="Logotipo SAPAC">
        <h1>Buzón de Quejas</h1>
    </header>
    <main class="main">
        <div class="formulario">
            <form name="frm" id="frm" method="POST" action="../../controlador/buzon/crearQueja.php" enctype="multipart/form-data" onsubmit="return validarFormulario(event)">
                <div class="form-check mb-3">
                    <input name="complaintType" id="qa" class="form-check-input" type="checkbox" onclick="toggleInfoPersonal()">
                    <label for="qa" class="form-check-label">Queja Anónima</label>
                </div>
                <div class="mb-3" id="infoPersonal">
                    <label for="nombre" class="form-label">Nombre completo:</label>
                    <input type="text" name="nombre" id="nombre" class="form-control">

                    <label for="telefono" class="form-label">Teléfono:</label>
                    <input type="text" name="telefono" id="telefono" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="domicilio" class="form-label">Domicilio:</label>
                    <input type="text" name="domicilio" id="domicilio" class="form-control">
                </div>
                <p class="text-info">Solo si la queja lo requiere</p>
                <div class="mb-3">
                    <label for="cuenta" class="form-label">Cuenta:</label>
                    <input type="text" name="cuenta" id="cuenta" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="motivo" class="form-label">Motivo:</label>
                    <input type="text" name="motivo" id="motivo" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="rp" class="form-label">Nombre completo del responsable:</label>
                    <input type="text" name="rp" id="rp" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="hechos" class="form-label">Hechos:</label>
                    <textarea name="hechos" id="hechos" class="form-control" required></textarea>
                </div>
                <p>¿Tiene pruebas?</p>
                <div>
                    <label><input type="radio" id="flexRadioDefault1" name="pruebas" onclick="togglePruebas(true)"> Sí</label>
                    <label><input type="radio" id="flexRadioDefault2" name="pruebas" onclick="togglePruebas(false)" checked> No</label>
                </div>
                <div class="mb-3" id="espeSection" style="display: none;">
                    <label class="form-label">Subir Evidencias:</label>
                    
                    <input class="form-control" type="file" name="espe[]" id="formFileMultiple" multiple>
                    <p class="text-warning">Tamaño máximo permitido (5 MB)</p>
                </div>
                <div class="d-flex justify-content-center mt-4">
                    <button type="submit" class="form_btn">Enviar Queja</button>
                </div>
            </form>  
        </div>
    </main> 
    <script src="../../controlador/buzon/validaciones.js"></script>
</body>
<script src="../../controlador/buzon/validaciones.js"></script>
</html>
